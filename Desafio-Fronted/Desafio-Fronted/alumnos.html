<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Alumnos - Sistema Escolar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<script>
const token = localStorage.getItem("token");
if (!token) {
    window.location.href = "index.html"; // Redirige al login si no hay token
}
</script>

<nav class="navbar navbar-dark bg-primary">
    <div class="container-fluid">
        <span class="navbar-brand">🎓 Gestión de Alumnos</span>
        <div>
            <a href="dashboard.html" class="btn btn-light me-2">Dashboard</a>
            <button class="btn btn-danger" onclick="logout()">Cerrar Sesión</button>
        </div>
    </div>
</nav>

<div class="container mt-4">

    <div class="card shadow">
        <div class="card-header bg-success text-white fw-bold" id="formTitle">
            Agregar Alumno
        </div>
        <div class="card-body">
            <form id="alumnoForm">
                <input type="hidden" id="alumnoId">

                <div class="mb-3">
                    <label class="form-label fw-semibold">Nombre</label>
                    <input type="text" id="nombreAlumno" class="form-control" placeholder="Ej: Beatriz" required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Apellido</label>
                    <input type="text" id="apellidoAlumno" class="form-control" placeholder="Ej: Melgar" required>
                </div>

                <button type="submit" id="btnGuardar" class="btn btn-success w-100 fw-bold">
                    Guardar Alumno
                </button>

                <button type="button" id="btnCancelar" class="btn btn-warning w-100 mt-2 d-none fw-bold" onclick="cancelarEdicion()">
                    Cancelar Edición
                </button>
            </form>
            <div id="mensaje" class="mt-3"></div>
        </div>
    </div>

    <div class="card shadow mt-4">
        <div class="card-header bg-dark text-white fw-bold">
            Alumnos Registrados
        </div>
        <div class="card-body">
            <table class="table table-bordered table-hover align-middle">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Apellido</th>
                        <th class="text-center">Acciones</th>
                    </tr>
                </thead>
                <tbody id="tablaAlumnos"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
const API_URL = "http://localhost:8080/api/alumno";

async function cargarAlumnos() {
    try {
        const response = await fetch(API_URL, {
            headers: { "Authorization": `Bearer ${token}` }
        });

        if (!response.ok) throw new Error("Error al obtener alumnos");
        const alumnos = await response.json();

        const tabla = document.getElementById("tablaAlumnos");
        tabla.innerHTML = "";

        alumnos.forEach(alumno => {
            tabla.innerHTML += `
                <tr>
                    <td>${alumno.id}</td>
                    <td>${alumno.nombre}</td>
                    <td>${alumno.apellido}</td>
                    <td class="text-center">
                        <button class="btn btn-warning btn-sm fw-bold" onclick="editarAlumno(${alumno.id}, '${alumno.nombre}', '${alumno.apellido}')">
                            Editar
                        </button>
                        <button class="btn btn-danger btn-sm fw-bold ms-1" onclick="eliminarAlumno(${alumno.id})">
                            Eliminar
                        </button>
                    </td>
                </tr>`;
        });
    } catch (error) {
        console.error(error);
    }
}

document.getElementById("alumnoForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    const id = document.getElementById("alumnoId").value;
    const nombre = document.getElementById("nombreAlumno").value.trim();
    const apellido = document.getElementById("apellidoAlumno").value.trim();

    const metodo = id ? "PUT" : "POST";
    const url = id ? `${API_URL}/${id}` : API_URL;

    try {
        const response = await fetch(url, {
            method: metodo,
            headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${token}`
            },
            body: JSON.stringify({ nombre, apellido })
        });

        if (response.ok) {
            document.getElementById("mensaje").innerHTML = `
                <div class="alert alert-success">Alumno guardado correctamente.</div>`;
            cancelarEdicion();
            cargarAlumnos();
        } else {
            document.getElementById("mensaje").innerHTML = `
                <div class="alert alert-danger">Error al guardar el alumno.</div>`;
        }
    } catch (error) {
        console.error(error);
    }
});

function editarAlumno(id, nombre, apellido) {
    document.getElementById("alumnoId").value = id;
    document.getElementById("nombreAlumno").value = nombre;
    document.getElementById("apellidoAlumno").value = apellido;

    document.getElementById("formTitle").innerText = "Actualizar Datos del Alumno";
    document.getElementById("btnGuardar").textContent = "Actualizar Alumno";
    document.getElementById("btnCancelar").classList.remove("d-none");
}

function cancelarEdicion() {
    document.getElementById("alumnoForm").reset();
    document.getElementById("alumnoId").value = "";
    document.getElementById("formTitle").innerText = "Agregar Alumno";
    document.getElementById("btnGuardar").textContent = "Guardar Alumno";
    document.getElementById("btnCancelar").classList.add("d-none");
}

async function eliminarAlumno(id) {
    if (!confirm("¿Deseas eliminar este alumno del sistema?")) return;

    try {
        const response = await fetch(`${API_URL}/${id}`, {
            method: "DELETE",
            headers: { "Authorization": `Bearer ${token}` }
        });

        if (response.ok) {
            cargarAlumnos();
        } else {
            alert("No se pudo eliminar al alumno seleccionado.");
        }
    } catch (error) {
        console.error(error);
    }
}

function logout() {
    localStorage.removeItem("token");
    window.location.href = "index.html";
}

// Inicializar la tabla
cargarAlumnos();
</script>
</body>
</html>
