<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Materias</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<script>
const token = localStorage.getItem("token");

if (!token) {
    window.location.href = "index.html";
}
</script>

<nav class="navbar navbar-dark bg-primary">
    <div class="container-fluid">
        <span class="navbar-brand">📚 Gestión de Materias</span>

        <div>
            <a href="dashboard.html" class="btn btn-light me-2">
                Dashboard
            </a>

            <button class="btn btn-danger" onclick="logout()">
                Cerrar Sesión
            </button>
        </div>
    </div>
</nav>

<div class="container mt-5">

    <div class="card shadow">
        <div class="card-header bg-primary text-white fw-bold">
            Agregar Materia
        </div>

        <div class="card-body">
            <form id="materiaForm">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Nombre de la Materia</label>
                    <input
                        type="text"
                        id="nombreMateria"
                        class="form-control"
                        placeholder="Ej: Programación Java"
                        required>
                </div>

                <button class="btn btn-success w-100 fw-bold">
                    Guardar Materia
                </button>
            </form>

            <div id="mensaje" class="mt-3"></div>
        </div>
    </div>

    <div class="card shadow mt-4">
        <div class="card-header bg-dark text-white fw-bold">
            Materias Registradas
        </div>

        <div class="card-body">
            <table class="table table-bordered table-hover align-middle">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Materia</th>
                    </tr>
                </thead>
                <tbody id="tablaMaterias"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
const API_URL = "http://localhost:8080/api/materia";

async function cargarMaterias() {
    try {
        const response = await fetch(API_URL, {
            headers: {
                Authorization: `Bearer ${token}`
            }
        });

        const materias = await response.json();
        const tabla = document.getElementById("tablaMaterias");
        tabla.innerHTML = "";

        materias.forEach(materia => {
            tabla.innerHTML += `
                <tr>
                    <td>${materia.id}</td>
                    <td>${materia.nombre}</td>
                </tr>
            `;
        });
    } catch(error) {
        console.error(error);
    }
}

document.getElementById("materiaForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const nombre = document.getElementById("nombreMateria").value;

    try {
        const response = await fetch(API_URL, {
            method: "POST",
            headers: {
                "Content-Type":"application/json",
                "Authorization": `Bearer ${token}`
            },
            body: JSON.stringify({
                nombre: nombre
            })
        });

        if(response.ok){
            document.getElementById("mensaje").innerHTML = `
                <div class="alert alert-success">Materia agregada correctamente.</div>`;
            document.getElementById("materiaForm").reset();
            cargarMaterias();
        }else{
            document.getElementById("mensaje").innerHTML = `
                <div class="alert alert-danger">Error al guardar la materia.</div>`;
        }
    } catch(error) {
        console.error(error);
    }
});

// FUNCIÓN DE LOGOUT AGREGADA
function logout(){
    localStorage.removeItem("token");
    window.location.href = "login.html";
}

cargarMaterias();
</script>
</body>
</html>
