<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Notas - Sistema Escolar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<script>
const token = localStorage.getItem("token");
if (!token) {
    window.location.href = "index.html";
}
</script>

<nav class="navbar navbar-dark bg-primary">
    <div class="container-fluid">
        <span class="navbar-brand">🎓 Gestión de Calificaciones</span>
        <div>
            <a href="dashboard.html" class="btn btn-light me-2">Dashboard</a>
            <button class="btn btn-danger" onclick="logout()">Cerrar Sesión</button>
        </div>
    </div>
</nav>

<div class="container mt-4">

    <div class="card shadow">
        <div class="card-header bg-success text-white fw-bold" id="formTitle">
            Registrar Nueva Nota
        </div>
        <div class="card-body">
            <form id="notaForm">
                <input type="hidden" id="notaId">

                <div class="mb-3">
                    <label class="form-label fw-semibold">Seleccionar Alumno</label>
                    <select id="selectAlumno" class="form-select" required>
                        <option value="">Cargando alumnos...</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Seleccionar Materia</label>
                    <select id="selectMateria" class="form-select" required>
                        <option value="">Cargando materias...</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Calificación (Nota)</label>
                    <input type="number" step="0.1" min="0" max="10" id="valorNota" class="form-control" placeholder="Ej: 9.5" required>
                </div>

                <button type="submit" id="btnGuardar" class="btn btn-success w-100 fw-bold">
                    Guardar Nota
                </button>

                <button type="button" id="btnCancelar" class="btn btn-warning w-100 mt-2 d-none fw-bold" onclick="cancelarEdicion()">
                    Cancelar Edición
                </button>
            </form>
            <div id="mensaje" class="mt-3"></div>
        </div>
    </div>

    <div class="card shadow mt-4">
        <div class="card-header bg-dark text-white fw-bold">
            Notas Registradas en el Sistema
        </div>
        <div class="card-body">
            <table class="table table-bordered table-hover align-middle">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Alumno</th>
                        <th>Materia</th>
                        <th>Calificación</th>
                        <th class="text-center">Acciones</th>
                    </tr>
                </thead>
                <tbody id="tablaNotas"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
const BASE_URL = "http://localhost:8080/api/notas";
const ALUMNO_URL = "http://localhost:8080/api/alumno";
const MATERIA_URL = "http://localhost:8080/api/materia";

const headers = {
    "Content-Type": "application/json",
    "Authorization": `Bearer ${token}`
};

// 1. Cargar los alumnos en el select desplegable
async function cargarSelectAlumnos() {
    try {
        const response = await fetch(ALUMNO_URL, { headers });
        const alumnos = await response.json();
        const select = document.getElementById("selectAlumno");
        select.innerHTML = '<option value="">-- Seleccione un alumno --</option>';
        alumnos.forEach(a => {
            select.innerHTML += `<option value="${a.id}">${a.nombre} ${a.apellido}</option>`;
        });
    } catch (error) { console.error("Error cargando alumnos:", error); }
}

// 2. Cargar las materias en el select desplegable
async function cargarSelectMaterias() {
    try {
        const response = await fetch(MATERIA_URL, { headers });
        const materias = await response.json();
        const select = document.getElementById("selectMateria");
        select.innerHTML = '<option value="">-- Seleccione una materia --</option>';
        materias.forEach(m => {
            select.innerHTML += `<option value="${m.id}">${m.nombre}</option>`;
        });
    } catch (error) { console.error("Error cargando materias:", error); }
}

// 3. Cargar la tabla de notas
async function cargarNotas() {
    try {
        const response = await fetch(BASE_URL, { headers }); 
        if (!response.ok) throw new Error("Error al obtener las notas");
        const notas = await response.json();

        const tabla = document.getElementById("tablaNotas");
        tabla.innerHTML = "";

        notas.forEach(item => {
            // Evaluamos cómo viene el valor numérico desde tu backend
            const valorFinal = item.valor !== undefined ? item.valor : (item.nota !== undefined ? item.nota : item.calificacion);
            const nombreAlumno = item.alumno ? `${item.alumno.nombre} ${item.alumno.apellido}` : "No asignado";
            const nombreMateria = item.materia ? item.materia.nombre : "No asignada";
            
            tabla.innerHTML += `
                <tr>
                    <td>${item.id}</td>
                    <td>${nombreAlumno}</td>
                    <td>${nombreMateria}</td>
                    <td><span class="badge bg-primary fs-6">${valorFinal}</span></td>
                    <td class="text-center">
                        <button class="btn btn-warning btn-sm fw-bold" onclick="editarNota(${item.id}, ${valorFinal}, ${item.alumno?.id || ''}, ${item.materia?.id || ''})">
                            Editar
                        </button>
                        <button class="btn btn-danger btn-sm fw-bold ms-1" onclick="eliminarNota(${item.id})">
                            Eliminar
                        </button>
                    </td>
                </tr>`;
        });
    } catch (error) {
        console.error(error);
    }
}

// 4. Enviar los datos adaptados al mapeo exacto de tu Entidad Nota de Java
document.getElementById("notaForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    const id = document.getElementById("notaId").value;
    const alumnoId = parseInt(document.getElementById("selectAlumno").value);
    const materiaId = parseInt(document.getElementById("selectMateria").value);
    const notaValor = parseFloat(document.getElementById("valorNota").value);

    const metodo = id ? "PUT" : "POST";
    const url = id ? `${BASE_URL}/${id}` : BASE_URL;

    // JSON CON LAS PROPIEDADES EXACTAS QUE ESPERA TU CLASE NOTA.JAVA
    const datosEnvio = {
        valor: notaValor, 
        alumno: { 
            id: alumnoId 
        },
        materia: { 
            id: materiaId 
        }
    };

    // Si es una actualización (PUT), incluimos también el ID dentro del cuerpo
    if (id) {
        datosEnvio.id = parseInt(id);
    }

    try {
        const response = await fetch(url, {
            method: metodo,
            headers: headers,
            body: JSON.stringify(datosEnvio)
        });

        if (response.ok) {
            document.getElementById("mensaje").innerHTML = `
                <div class="alert alert-success">Nota almacenada de manera exitosa.</div>`;
            cancelarEdicion();
            cargarNotas();
        } else {
            document.getElementById("mensaje").innerHTML = `
                <div class="alert alert-danger">Error al guardar la calificación. Comprueba el log de Spring Boot.</div>`;
        }
    } catch (error) {
        console.error(error);
    }
});

function editarNota(id, valor, alumnoId, materiaId) {
    document.getElementById("notaId").value = id;
    document.getElementById("valorNota").value = valor;
    document.getElementById("selectAlumno").value = alumnoId;
    document.getElementById("selectMateria").value = materiaId;

    document.getElementById("formTitle").innerText = "Modificar Nota";
    document.getElementById("btnGuardar").textContent = "Actualizar Nota";
    document.getElementById("btnCancelar").classList.remove("d-none");
}

function cancelarEdicion() {
    document.getElementById("notaForm").reset();
    document.getElementById("notaId").value = "";
    document.getElementById("formTitle").innerText = "Registrar Nueva Nota";
    document.getElementById("btnGuardar").textContent = "Guardar Nota";
    document.getElementById("btnCancelar").classList.add("d-none");
}

async function eliminarNota(id) {
    if (!confirm("¿Seguro que deseas eliminar esta calificación?")) return;

    try {
        const response = await fetch(`${BASE_URL}/${id}`, {
            method: "DELETE",
            headers: { "Authorization": `Bearer ${token}` }
        });

        if (response.ok) {
            cargarNotas();
        } else {
            alert("No se pudo procesar la eliminación.");
        }
    } catch (error) {
        console.error(error);
    }
}

function logout() {
    localStorage.removeItem("token");
    window.location.href = "index.html";
}

// Inicializar todos los datos al entrar
cargarSelectAlumnos();
cargarSelectMaterias();
cargarNotas();
</script>
</body>
</html>
