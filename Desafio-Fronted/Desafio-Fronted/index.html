<div class="card shadow-lg p-4" style="width:450px;">

    <div class="text-center mb-3">
        <div class="logo">🎓</div>
        <h2>Sistema Escolar</h2>
    </div>

    <form id="authForm">

        <div class="mb-3">
            <label class="form-label">Usuario</label>
            <input
                type="text"
                id="username"
                class="form-control"
                required
            >
        </div>

        <div class="mb-3">
            <label class="form-label">Contraseña</label>
            <input
                type="password"
                id="password"
                class="form-control"
                required
            >
        </div>

        <div class="mb-3 d-none" id="confirmPasswordDiv">
            <label class="form-label">Confirmar Contraseña</label>
            <input
                type="password"
                id="confirmPassword"
                class="form-control"
            >
        </div>

        <button
            type="submit"
            class="btn btn-primary w-100"
            id="btnSubmit">
            Iniciar Sesión
        </button>

        <button
            type="button"
            class="btn btn-link w-100 mt-2"
            id="toggleMode">
            ¿No tienes cuenta? Regístrate
        </button>

    </form>

    <div id="mensaje" class="mt-3"></div>

</div>
```

</div>

<script>

const LOGIN_URL = "http://localhost:8080/api/auth/login";
const REGISTER_URL = "http://localhost:8080/api/auth/register";

let modoRegistro = false;

if(localStorage.getItem("token")){
    window.location.href = "dashboard.html";
}

const form = document.getElementById("authForm");
const mensaje = document.getElementById("mensaje");
const toggleMode = document.getElementById("toggleMode");
const confirmPasswordDiv = document.getElementById("confirmPasswordDiv");
const btnSubmit = document.getElementById("btnSubmit");

toggleMode.addEventListener("click", () => {

    modoRegistro = !modoRegistro;

    if(modoRegistro){

        confirmPasswordDiv.classList.remove("d-none");

        btnSubmit.textContent = "Registrarse";

        toggleMode.textContent =
            "¿Ya tienes cuenta? Inicia sesión";

    }else{

        confirmPasswordDiv.classList.add("d-none");

        btnSubmit.textContent = "Iniciar Sesión";

        toggleMode.textContent =
            "¿No tienes cuenta? Regístrate";
    }

    mensaje.innerHTML = "";
});

form.addEventListener("submit", async (e) => {

    e.preventDefault();

    const username =
        document.getElementById("username").value.trim();

    const password =
        document.getElementById("password").value;

    const confirmPassword =
        document.getElementById("confirmPassword").value;

    mensaje.innerHTML = "";

    if(modoRegistro){

        if(password.length < 4){

            mensaje.innerHTML = `
                <div class="alert alert-warning">
                    La contraseña debe tener al menos 4 caracteres.
                </div>
            `;

            return;
        }

        if(password !== confirmPassword){

            mensaje.innerHTML = `
                <div class="alert alert-danger">
                    Las contraseñas no coinciden.
                </div>
            `;

            return;
        }

        try{

            const response = await fetch(
                REGISTER_URL,
                {
                    method:"POST",
                    headers:{
                        "Content-Type":"application/json"
                    },
                    body:JSON.stringify({
                        username,
                        password
                    })
                }
            );

            const data = await response.json();

            if(response.ok){

                mensaje.innerHTML = `
                    <div class="alert alert-success">
                        Usuario registrado correctamente.
                        Ahora puedes iniciar sesión.
                    </div>
                `;

                modoRegistro = false;

                confirmPasswordDiv.classList.add("d-none");

                btnSubmit.textContent =
                    "Iniciar Sesión";

                toggleMode.textContent =
                    "¿No tienes cuenta? Regístrate";

                form.reset();

            }else{

                mensaje.innerHTML = `
                    <div class="alert alert-danger">
                        ${data.error || "Error al registrar usuario"}
                    </div>
                `;
            }

        }catch(error){

            console.error(error);

            mensaje.innerHTML = `
                <div class="alert alert-danger">
                    No se pudo conectar con el servidor.
                </div>
            `;
        }

    }else{

        try{

            const response = await fetch(
                LOGIN_URL,
                {
                    method:"POST",
                    headers:{
                        "Content-Type":"application/json"
                    },
                    body:JSON.stringify({
                        username,
                        password
                    })
                }
            );

            const data = await response.json();

            if(response.ok){

                localStorage.setItem(
                    "token",
                    data.token
                );

                mensaje.innerHTML = `
                    <div class="alert alert-success">
                        Bienvenido ${username}
                    </div>
                `;

                setTimeout(() => {

                    window.location.href =
                        "dashboard.html";

                },1000);

            }else{

                mensaje.innerHTML = `
                    <div class="alert alert-danger">
                        Usuario o contraseña incorrectos.
                    </div>
                `;
            }

        }catch(error){

            console.error(error);

            mensaje.innerHTML = `
                <div class="alert alert-danger">
                    No se pudo conectar con el servidor.
                </div>
            `;
        }
    }
});

</script>

</body>
</html>
